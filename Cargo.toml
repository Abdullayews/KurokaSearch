[package]
name = "kuroka-search"
version = "3.2.1"
edition = "2021"
description = "KurokaSearch — privacy-first metasearch engine, written in Rust"
license = "AGPL-3.0-or-later"
authors = ["Abdullayews <08abdullayevv@gmail.com>"]
repository = "https://github.com/Abdullayews/KurokaSearch"

[dependencies]
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
